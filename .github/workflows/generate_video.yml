name: 動画生成

on:
  workflow_dispatch:
    inputs:
      script_url:
        description: 'GitHub GistのURL（例: https://gist.github.com/username/abcdef123456）'
        required: true
        type: string
      solid_bg:
        description: '黒背景を使用（テスト用・高速）'
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4.2.2

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: システム依存パッケージをインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra

      - name: Pythonパッケージをインストール
        run: pip install -r requirements.txt

      - name: AivisSpeechモデルをキャッシュから復元
        id: model-cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.local/share/AivisSpeech-Engine/Models
          key: aivis-model-default-v1

      - name: AivisSpeechモデルをダウンロード（キャッシュミス時）
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/AivisSpeech-Engine/Models
          echo "モデルをダウンロード中（251MB）..."
          curl -L -o ~/.local/share/AivisSpeech-Engine/Models/default.aivmx \
            https://github.com/finracofficial-cmd/youtubecreation/releases/download/models-v1/default.aivmx
          echo "✅ ダウンロード完了"

      - name: AivisSpeech Engine を起動
        run: |
          docker run -d --name aivisspeech \
            -p 10101:10101 \
            -v ~/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev \
            ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          echo "エンジン起動待ち（最大10分）..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:10101/speakers > /dev/null 2>&1; then
              echo "✅ AivisSpeech Engine 起動完了 (${i}回目)"
              curl -s http://localhost:10101/speakers | python3 -c "import json,sys; speakers=json.load(sys.stdin); [print(f'  話者: {s[\"name\"]}') for s in speakers]"
              exit 0
            fi
            echo "  待機中... ($i/120)"
            sleep 5
          done
          echo "❌ AivisSpeech Engine が起動しませんでした"
          docker logs aivisspeech
          exit 1

      - name: GistからスクリプトをDL
        run: |
          mkdir -p scripts
          python - <<'EOF'
          import re, urllib.request, json, sys
          url = "${{ inputs.script_url }}"
          m = re.search(r'gist\.github\.com/[^/]+/([0-9a-f]+)', url)
          if not m:
              print(f"❌ Gist URLが正しくありません: {url}")
              sys.exit(1)
          gist_id = m.group(1)
          api_url = f"https://api.github.com/gists/{gist_id}"
          req = urllib.request.Request(api_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          files = data.get("files", {})
          if not files:
              print("❌ Gistにファイルがありません")
              sys.exit(1)
          file_info = next(iter(files.values()))
          content = file_info.get("content", "")
          out_path = "scripts/run_${{ github.run_number }}.txt"
          with open(out_path, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"✅ Gistから取得: {len(content)}文字 → {out_path}")
          EOF

      - name: 動画を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          TTS_ENGINE_URL: http://localhost:10101
          TTS_SPEAKER_NAME: 阿井田 茂
          TTS_STYLE_NAME: Calm
          SUBTITLE_FONT: Noto Sans CJK JP
        run: |
          ARGS=(scripts/run_${{ github.run_number }}.txt --output "run_${{ github.run_number }}")
          if [ "${{ inputs.solid_bg }}" = "true" ]; then
            ARGS+=(--solid-bg)
          fi
          python main.py "${ARGS[@]}"

      - name: 生成された動画をアップロード
        uses: actions/upload-artifact@v4.6.2
        with:
          name: video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 30
          if-no-files-found: error

      - name: 台本もアップロード
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: script-${{ github.run_number }}
          path: scripts/*.txt
          retention-days: 30
