name: 動画生成

on:
  workflow_dispatch:
    inputs:
      script:
        description: '台本テキストをここに貼り付け（## title: と ## background: を含む形式）'
        required: true
        type: string
      speaker:
        description: 'スピーカー'
        required: false
        default: 'jvnv-M1-jp'
        type: choice
        options:
          - jvnv-M1-jp
          - jvnv-M2-jp
          - jvnv-F1-jp
          - jvnv-F2-jp
      solid_bg:
        description: '黒背景を使用（テスト用・高速）'
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4.2.2

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: システム依存パッケージをインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra

      - name: PyTorch（CPU版）をインストール
        run: |
          pip install "numpy<2.0"
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Pythonパッケージをインストール
        run: pip install -r requirements.txt

      - name: HuggingFaceモデルをキャッシュから復元
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/huggingface
          key: hf-sbv2-jp-extra-v1
          restore-keys: hf-sbv2-jp-extra-

      - name: 台本をファイルに保存
        env:
          SCRIPT_CONTENT: ${{ inputs.script }}
        run: |
          mkdir -p scripts
          printf '%s' "$SCRIPT_CONTENT" > scripts/run_${{ github.run_number }}.txt

      - name: 動画を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_SPEAKER: ${{ inputs.speaker }}
          TTS_DEVICE: cpu
          SUBTITLE_FONT: Noto Sans CJK JP
        run: |
          ARGS=(scripts/run_${{ github.run_number }}.txt --output "run_${{ github.run_number }}")
          if [ "${{ inputs.solid_bg }}" = "true" ]; then
            ARGS+=(--solid-bg)
          fi
          python main.py "${ARGS[@]}"

      - name: 生成された動画をアップロード
        uses: actions/upload-artifact@v4.6.2
        with:
          name: video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 30
          if-no-files-found: error

      - name: 台本もアップロード
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: script-${{ github.run_number }}
          path: scripts/*.txt
          retention-days: 30
